<circle class="bb" cx="150" cy="330" r="8" style="animation-duration:8s;animation-delay:-8s"/>
<circle class="bb" cx="865" cy="330" r="4" style="animation-duration:6s;animation-delay:-9s"/>
<circle class="bb" cx="614" cy="330" r="4" style="animation-duration:8s;animation-delay:-1s"/>

<text x="500" y="205" text-anchor="middle" font-size="44" font-weight="700">Hi, I'm Aong (Oong)</text>
<text x="500" y="244" text-anchor="middle" font-size="20" opacity=".9">Music · Art · Programming · Cooking</text>
</g>
<rect x="3" y="3" width="994" height="314" rx="24" fill="none" stroke="url(#edge)" stroke-width="5"/>
<rect class="run" x="3" y="3" width="994" height="314" rx="24" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" pathLength="1000" stroke-dasharray="70 930" opacity=".9"/>
</svg>