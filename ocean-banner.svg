<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Animated ocean banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8fbff"/><stop offset="1" stop-color="#9fe3ef"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a9bc0"/><stop offset=".55" stop-color="#093e5e"/><stop offset="1" stop-color="#021525"/></linearGradient>
<g id="fish"><path d="M24 15Q42 0 58 15Q42 30 24 15Z"/><path d="M26 15L4 3V27Z"/><circle cx="50" cy="13" r="1.8" fill="#093e5e"/></g>
<clipPath id="round"><rect width="1000" height="320" rx="26"/></clipPath>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#35c0d6"/><stop offset=".5" stop-color="#ff8f70"/><stop offset="1" stop-color="#7fdcea"/></linearGradient>
</defs>
<style>
.w{animation:slide ease-in-out infinite alternate}
.w.r{animation-direction:alternate-reverse}
@keyframes slide{from{transform:translateX(-45px)}to{transform:translateX(45px)}}
.fs{animation:swim linear infinite}
@keyframes swim{from{transform:translateX(-120px)}to{transform:translateX(1120px)}}
.bb{fill:none;stroke:#d9f7fb;stroke-width:1.6;opacity:.8;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-360px);opacity:0}}
.sun{animation:glow 4s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.85}to{opacity:1}}
text{font-family:'Segoe UI',Tahoma,Arial,sans-serif;fill:#eafcff}
.run{animation:run 5s linear infinite}
@keyframes run{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
</style>
<g clip-path="url(#round)">
<rect width="1000" height="320" fill="url(#sea)"/>
<rect width="1000" height="140" fill="url(#sky)"/>
<circle class="sun" cx="860" cy="62" r="30" fill="#ff8f70"/>
<path class="w" style="animation-duration:11s" fill="#bff0f7" d="M-150 108 Q -45 96 60 108 T 270 108 T 480 108 T 690 108 T 900 108 T 1110 108 T 1320 108 V320 H-150 Z"/>
<path class="w r" style="animation-duration:8s" fill="#7fdcea" d="M-150 130 Q -70 114 10 130 T 170 130 T 330 130 T 490 130 T 650 130 T 810 130 T 970 130 T 1130 130 T 1290 130 V320 H-150 Z"/>
<path class="w" style="animation-duration:13s" fill="#4cc3dc" d="M-150 152 Q -55 141 40 152 T 230 152 T 420 152 T 610 152 T 800 152 T 990 152 T 1180 152 V320 H-150 Z"/>
<path class="w r" style="animation-duration:7s" fill="#2aa7c9" d="M-150 174 Q -80 157 -10 174 T 130 174 T 270 174 T 410 174 T 550 174 T 690 174 T 830 174 T 970 174 T 1110 174 T 1250 174 V320 H-150 Z"/>
<path class="w" style="animation-duration:12s" fill="#1788b3" d="M-150 196 Q -65 184 20 196 T 190 196 T 360 196 T 530 196 T 700 196 T 870 196 T 1040 196 T 1210 196 V320 H-150 Z"/>
<path class="w r" style="animation-duration:9s" fill="#0f6d9a" d="M-150 218 Q -85 203 -20 218 T 110 218 T 240 218 T 370 218 T 500 218 T 630 218 T 760 218 T 890 218 T 1020 218 T 1150 218 V320 H-150 Z"/>

<g class="fs" style="animation-duration:26s;animation-delay:-4s" opacity="0.35"><g transform="translate(0 215) scale(0.9)" fill="#d9f7fb"><use href="#fish"/></g></g>
<g class="fs" style="animation-duration:34s;animation-delay:-18s" opacity="0.28"><g transform="translate(0 255) scale(1.3)" fill="#d9f7fb"><use href="#fish"/></g></g>
<g class="fs" style="animation-duration:22s;animation-delay:-10s" opacity="0.4"><g transform="translate(0 285) scale(0.7)" fill="#d9f7fb"><use href="#fish"/></g></g>
<g class="fs" style="animation-duration:30s;animation-delay:-24s" opacity="0.3"><g transform="translate(0 185) scale(0.8)" fill="#d9f7fb"><use href="#fish"/></g></g>

<circle class="bb" cx="361" cy="330" r="4" style="animation-duration:9s;animation-delay:-10s"/>
<circle class="bb" cx="79" cy="330" r="3" style="animation-duration:12s;animation-delay:-8s"/>
<circle class="bb" cx="126" cy="330" r="5" style="animation-duration:10s;animation-delay:0s"/>
<circle class="bb" cx="961" cy="330" r="8" style="animation-duration:7s;animation-delay:0s"/>
<circle class="bb" cx="118" cy="330" r="6" style="animation-duration:9s;animation-delay:-1s"/>
<circle class="bb" cx="276" cy="330" r="3" style="animation-duration:10s;animation-delay:-6s"/>
